name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dependency manifest
        shell: powershell
        run: ./packaging/setup.ps1 -CheckOnly
      - name: Validate release source and catalog
        run: python packaging/validate.py
      - name: Test automatic setup planning and failures
        run: python -m unittest discover -s packaging -p test_setup.py
      - name: Build
        shell: powershell
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Waze-Voice-Studio-Windows-x64
          path: dist/*
